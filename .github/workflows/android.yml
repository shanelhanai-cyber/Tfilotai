
name: Build Tfilotai APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'TfilotaiAndroid_project.zip'
      - '.github/workflows/android.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Extract project
        run: unzip -o TfilotaiAndroid_project.zip

      - name: Build APK
        working-directory: TfilotaiAndroid
        run: gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Tfilotai-APK
          path: TfilotaiAndroid/app/build/outputs/apk/debug/app-debug.apk
